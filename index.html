<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Image to PDF Converter</title>

  <link rel="manifest"
        href="https://yc-creates729.github.io/Fastpdf/manifest.json">

  <!-- jsPDF -->
  <script
    src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js">
  </script>

  <!-- HEIC / HEIF converter -->
  <script
    src="https://unpkg.com/heic2any@0.0.4/dist/heic2any.min.js">
  </script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow:
        0 4px 12px rgba(15, 23, 42, 0.05);
    }

    /* =========================
       DROP ZONE
    ========================= */

    .dropzone {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      background: #fafafa;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: #eff6ff;
    }

    .dropzone svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      stroke: var(--accent);
    }

    .dropzone p {
      font-size: 15px;
      font-weight: 600;
    }

    .dropzone span {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    /*
      IMPORTANT:
      The input stays inside the dropzone but does NOT submit
      anything or reload the page.
    */

    #fileInput {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .control-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select,
    input[type="text"] {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    select:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
    }

    /* =========================
       PREVIEW
    ========================= */

    .preview-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 20px;

      max-height: 400px;
      overflow-y: auto;
    }

    .preview-list:empty {
      display: none;
    }

    .preview-item {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 8px 10px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: #f8fafc;
    }

    .preview-number {
      min-width: 25px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .preview-item img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 7px;
      background: #e5e7eb;
    }

    .preview-info {
      flex: 1;
      min-width: 0;
    }

    .preview-name {
      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-size {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .status-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;

      background: #dbeafe;
      color: #1e40af;

      border-radius: 4px;

      font-size: 9px;
      font-weight: 700;
    }

    .btn-remove {
      width: 34px;
      height: 34px;

      border: none;
      border-radius: 7px;

      background: transparent;
      color: var(--danger);

      font-size: 21px;
      cursor: pointer;
    }

    .btn-remove:hover {
      background: #fee2e2;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      display: none;

      margin-top: 15px;
      padding: 10px;

      border-radius: 8px;

      background: #eff6ff;
      color: #1e40af;

      font-size: 13px;
      text-align: center;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      font-family: inherit;
    }

    .primary {
      flex: 1;

      border: none;
      border-radius: 8px;

      background: var(--accent);
      color: white;

      padding: 12px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      border: 1px solid var(--border);
      border-radius: 8px;

      background: white;
      color: var(--text);

      padding: 12px 16px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .secondary:hover {
      background: #f1f5f9;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      body {
        padding: 20px 10px;
      }

      .card {
        padding: 15px;
      }

      header h1 {
        font-size: 24px;
      }

      .dropzone {
        padding: 32px 15px;
      }

      .actions {
        flex-direction: column-reverse;
      }

      .secondary {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Universal Image to PDF Converter</h1>

      <p>
        Convert JPG, PNG, WEBP, HEIC and HEIF images to PDF.
      </p>
    </header>


    <div class="card">

      <!-- =========================
           UPLOAD AREA
      ========================== -->

      <div
        class="dropzone"
        id="dropzone"
      >

        <svg
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"
          />
        </svg>

        <p>
          Tap to select images
        </p>

        <span>
          You can select multiple images
        </span>

        <span>
          JPG • JPEG • PNG • WEBP • HEIC • HEIF
        </span>

        <input
          type="file"
          id="fileInput"
          multiple
          accept="image/*,.heic,.heif"
        />

      </div>


      <!-- =========================
           SETTINGS
      ========================== -->

      <div class="controls">

        <div class="control-group">

          <label for="pageSize">
            Page Size
          </label>

          <select id="pageSize">

            <option value="a4">
              A4 (Standard)
            </option>

            <option value="letter">
              Letter
            </option>

            <option value="fit">
              Fit to Image Size
            </option>

          </select>

        </div>


        <div class="control-group">

          <label for="orientation">
            Orientation
          </label>

          <select id="orientation">

            <option value="portrait">
              Portrait
            </option>

            <option value="landscape">
              Landscape
            </option>

          </select>

        </div>


        <div class="control-group">

          <label for="fileName">
            Output Filename
          </label>

          <input
            type="text"
            id="fileName"
            value="converted_images.pdf"
          />

        </div>

      </div>


      <!-- =========================
           STATUS
      ========================== -->

      <div id="status"></div>


      <!-- =========================
           IMAGE LIST
      ========================== -->

      <div
        class="preview-list"
        id="previewList"
      ></div>


      <!-- =========================
           ACTIONS
      ========================== -->

      <div class="actions">

        <button
          type="button"
          class="secondary"
          id="clearBtn"
          style="display:none;"
        >
          Clear All
        </button>

        <button
          type="button"
          class="primary"
          id="convertBtn"
          disabled
        >
          Generate & Download PDF
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       AD
  ========================== -->

  <div
    style="
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      margin:30px 0;
    "
  >

    <script
      async="async"
      data-cfasync="false"
      src="https://bauval.org/21/9e907323644da4c73c9c1beda2314e15">
    </script>

    <div
      id="container-9e907323644da4c73c9c1beda2314e15">
    </div>

    <script>

      var atOptions = {
        'key': '8e232532dab8bbcd6c3fda646d2f4ddd',
        'format': 'iframe',
        'height': 250,
        'width': 300,
        'params': {}
      };

    </script>

    <script
      src="https://bauval.org/22/8e232532dab8bbcd6c3fda646d2f4ddd">
    </script>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const fileInput =
      document.getElementById("fileInput");

    const dropzone =
      document.getElementById("dropzone");

    const previewList =
      document.getElementById("previewList");

    const convertBtn =
      document.getElementById("convertBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const pageSizeSelect =
      document.getElementById("pageSize");

    const orientationSelect =
      document.getElementById("orientation");

    const fileNameInput =
      document.getElementById("fileName");

    const statusBox =
      document.getElementById("status");


    /*
      IMPORTANT

      All selected images are stored here.

      Selecting more images DOES NOT replace
      previous images.

      This fixes the "first page resets" problem.
    */

    let filesStore = [];


    /* =========================================
       FILE SELECTION
    ========================================= */

    fileInput.addEventListener(
      "change",
      async function(event) {

        const selectedFiles =
          Array.from(event.target.files || []);

        if (selectedFiles.length === 0) {
          return;
        }

        await addFiles(selectedFiles);

        /*
          IMPORTANT:

          Reset only the input element.

          This does NOT reset the application.

          It allows the same image to be selected
          again later.
        */

        fileInput.value = "";

      }
    );


    /* =========================================
       ADD FILES
    ========================================= */

    async function addFiles(files) {

      showStatus(
        "Adding " + files.length + " image(s)..."
      );

      for (const file of files) {

        try {

          const item =
            await prepareImage(file);

          filesStore.push(item);

        } catch (error) {

          console.error(error);

          alert(
            "Could not load:\n" +
            file.name
          );

        }

      }

      renderPreviews();

      hideStatus();

    }


    /* =========================================
       PREPARE IMAGE
    ========================================= */

    async function prepareImage(file) {

      const name =
        file.name.toLowerCase();

      const isHEIC =
        name.endsWith(".heic") ||
        name.endsWith(".heif") ||
        file.type === "image/heic" ||
        file.type === "image/heif";


      /*
        HEIC / HEIF

        Convert to JPEG before displaying.
      */

      if (isHEIC) {

        if (typeof heic2any === "undefined") {

          throw new Error(
            "HEIC converter is not available."
          );

        }

        const converted =
          await heic2any({
            blob: file,
            toType: "image/jpeg",
            quality: 0.92
          });

        const blob =
          Array.isArray(converted)
            ? converted[0]
            : converted;

        const url =
          URL.createObjectURL(blob);

        return {
          file: blob,
          name: file.name,
          size: file.size,
          url: url,
          format: "JPEG"
        };

      }


      /*
        Normal image formats
      */

      const url =
        URL.createObjectURL(file);

      return {
        file: file,
        name: file.name,
        size: file.size,
        url: url,
        format: "JPEG"
      };

    }


    /* =========================================
       RENDER PREVIEWS
    ========================================= */

    function renderPreviews() {

      previewList.innerHTML = "";

      filesStore.forEach(
        (item, index) => {

          const element =
            document.createElement("div");

          element.className =
            "preview-item";


          element.innerHTML = `

            <div class="preview-number">
              ${index + 1}
            </div>

            <img
              src="${item.url}"
              alt=""
            >

            <div class="preview-info">

              <div class="preview-name">
                ${escapeHTML(item.name)}
              </div>

              <div class="preview-size">
                ${formatFileSize(item.size)}
              </div>

              <span class="status-badge">
                ${item.format}
              </span>

            </div>

            <button
              type="button"
              class="btn-remove"
              title="Remove image"
              data-index="${index}"
            >
              ×
            </button>

          `;

          previewList.appendChild(element);

        }
      );


      /*
        Update buttons
      */

      const hasImages =
        filesStore.length > 0;

      convertBtn.disabled =
        !hasImages;

      clearBtn.style.display =
        hasImages
          ? "block"
          : "none";

    }


    /* =========================================
       REMOVE IMAGE
    ========================================= */

    previewList.addEventListener(
      "click",
      function(event) {

        const button =
          event.target.closest(
            ".btn-remove"
          );

        if (!button) {
          return;
        }

        const index =
          Number(button.dataset.index);

        removeImage(index);

      }
    );


    function removeImage(index) {

      if (
        index < 0 ||
        index >= filesStore.length
      ) {
        return;
      }


      /*
        Free browser memory
      */

      const item =
        filesStore[index];

      if (
        item.url &&
        item.url.startsWith("blob:")
      ) {

        URL.revokeObjectURL(
          item.url
        );

      }


      filesStore.splice(
        index,
        1
      );

      renderPreviews();

    }


    /* =========================================
       CLEAR ALL
    ========================================= */

    clearBtn.addEventListener(
      "click",
      function() {

        filesStore.forEach(
          item => {

            if (
              item.url &&
              item.url.startsWith("blob:")
            ) {

              URL.revokeObjectURL(
                item.url
              );

            }

          }
        );

        filesStore = [];

        fileInput.value = "";

        renderPreviews();

      }
    );


    /* =========================================
       DRAG & DROP
    ========================================= */

    dropzone.addEventListener(
      "dragover",
      function(event) {

        event.preventDefault();

        dropzone.classList.add(
          "dragover"
        );

      }
    );


    dropzone.addEventListener(
      "dragleave",
      function() {

        dropzone.classList.remove(
          "dragover"
        );

      }
    );


    dropzone.addEventListener(
      "drop",
      async function(event) {

        event.preventDefault();

        dropzone.classList.remove(
          "dragover"
        );

        const files =
          Array.from(
            event.dataTransfer.files || []
          );

        if (files.length > 0) {

          await addFiles(files);

        }

      }
    );


    /* =========================================
       GENERATE PDF
    ========================================= */

    convertBtn.addEventListener(
      "click",
      async function() {

        if (filesStore.length === 0) {
          return;
        }

        convertBtn.disabled = true;

        convertBtn.textContent =
          "Creating PDF...";


        try {

          const {
            jsPDF
          } = window.jspdf;


          const pageFormat =
            pageSizeSelect.value;

          const orientation =
            orientationSelect.value;


          let doc = null;


          /*
            Process every image
          */

          for (
            let i = 0;
            i < filesStore.length;
            i++
          ) {

            const item =
              filesStore[i];


            convertBtn.textContent =
              `Processing ${i + 1} / ${filesStore.length}`;


            const image =
              await loadImage(item.url);


            const width =
              image.naturalWidth ||
              image.width;

            const height =
              image.naturalHeight ||
              image.height;


            /*
              First page
            */

            if (i === 0) {

              if (pageFormat === "fit") {

                doc =
                  new jsPDF({

                    orientation:
                      width > height
                        ? "landscape"
                        : "portrait",

                    unit: "px",

                    format: [
                      width,
                      height
                    ]

                  });

              } else {

                doc =
                  new jsPDF({

                    orientation:
                      orientation === "landscape"
                        ? "landscape"
                        : "portrait",

                    unit: "mm",

                    format:
                      pageFormat

                  });

              }

            }


            /*
              Additional pages
            */

            else {

              if (pageFormat === "fit") {

                doc.addPage(
                  [
                    width,
                    height
                  ],

                  width > height
                    ? "landscape"
                    : "portrait"
                );

              } else {

                doc.addPage(
                  pageFormat,

                  orientation === "landscape"
                    ? "landscape"
                    : "portrait"
                );

              }

            }


            const pageWidth =
              doc.internal.pageSize.getWidth();

            const pageHeight =
              doc.internal.pageSize.getHeight();


            /*
              FIT TO IMAGE
            */

            if (
              pageFormat === "fit"
            ) {

              doc.addImage(
                image,
                "JPEG",
                0,
                0,
                pageWidth,
                pageHeight,
                undefined,
                "FAST"
              );

            }


            /*
              A4 / LETTER
            */

            else {

              const margin = 10;

              const maxWidth =
                pageWidth -
                margin * 2;

              const maxHeight =
                pageHeight -
                margin * 2;


              const ratio =
                Math.min(
                  maxWidth / width,
                  maxHeight / height
                );


              const renderWidth =
                width * ratio;

              const renderHeight =
                height * ratio;


              const x =
                margin +
                (
                  maxWidth -
                  renderWidth
                ) / 2;


              const y =
                margin +
                (
                  maxHeight -
                  renderHeight
                ) / 2;


              doc.addImage(
                image,
                "JPEG",
                x,
                y,
                renderWidth,
                renderHeight,
                undefined,
                "FAST"
              );

            }

          }


          /*
            Filename
          */

          let filename =
            fileNameInput.value.trim();


          if (!filename) {

            filename =
              "converted_images.pdf";

          }


          if (
            !filename
              .toLowerCase()
              .endsWith(".pdf")
          ) {

            filename += ".pdf";

          }


          /*
            Download
          */

          doc.save(filename);


        } catch (error) {

          console.error(
            "PDF ERROR:",
            error
          );

          alert(
            "Unable to create PDF.\n\n" +
            error.message
          );

        }


        /*
          Restore button
        */

        convertBtn.disabled =
          filesStore.length === 0;

        convertBtn.textContent =
          "Generate & Download PDF";

      }
    );


    /* =========================================
       LOAD IMAGE
    ========================================= */

    function loadImage(url) {

      return new Promise(
        function(resolve, reject) {

          const image =
            new Image();

          image.onload =
            function() {

              resolve(image);

            };

          image.onerror =
            function() {

              reject(
                new Error(
                  "Unable to load image."
                )
              );

            };

          image.src = url;

        }
      );

    }


    /* =========================================
       FILE SIZE
    ========================================= */

    function formatFileSize(bytes) {

      if (bytes < 1024) {

        return bytes + " B";

      }

      if (bytes < 1024 * 1024) {

        return (
          (bytes / 1024)
            .toFixed(1) +
          " KB"
        );

      }

      return (
        (bytes / (1024 * 1024))
          .toFixed(1) +
        " MB"
      );

    }


    /* =========================================
       HTML ESCAPE
    ========================================= */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* =========================================
       STATUS
    ========================================= */

    function showStatus(message) {

      statusBox.textContent =
        message;

      statusBox.style.display =
        "block";

    }


    function hideStatus() {

      statusBox.style.display =
        "none";

    }

  </script>

</body>
